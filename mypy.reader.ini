# Neon X's settings, for pupil_labs.video_reader, its tests and tools/.
[mypy]
python_version = 3.13
files = src/pupil_labs/video_reader, tests/video_reader, tools
mypy_path = src
strict = true
warn_unreachable = true
show_error_codes = true
explicit_package_bases = True

[mypy-pupil_labs.video.*]
ignore_errors = true
